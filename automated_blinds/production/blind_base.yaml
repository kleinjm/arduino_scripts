# Automated Blinds - Base Configuration
# This file contains all common code. Per-blind configs override substitutions.

esphome:
  name: ${device_name}
  includes:
    - tmc2209_hw_stepper.h
  libraries:
    - "TMCStepper"
  on_boot:
    priority: 600.0
    then:
      - lambda: |-
          static TMC2209HWStepper stepper_instance(${pin_step}, ${pin_dir}, ${pin_enable}, ${pin_diag}, ${pin_uart_rx}, ${pin_uart_tx});
          g_stepper = &stepper_instance;
          g_stepper->setup();
      - delay: 500ms
      - lambda: |-
          if (g_stepper) {
            g_stepper->set_speed(${normal_speed});
            g_stepper->set_current(${run_current}, ${hold_current});
            g_stepper->set_stall_threshold(${homing_stall_threshold});
            ESP_LOGI("main", "Stepper ready - StallGuard enabled");
          }

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

api:

ota:
  platform: esphome

web_server:
  port: 80

globals:
  - id: blind_max_steps
    type: int
    initial_value: '${blind_max_steps}'
  - id: is_homing
    type: bool
    initial_value: 'false'
  - id: last_cover_position
    type: float
    initial_value: '0.0'

interval:
  - interval: 50ms
    then:
      - lambda: |-
          if (g_stepper != nullptr) {
            g_stepper->loop();
          }
      - if:
          condition:
            lambda: 'return id(is_homing) && g_stepper && g_stepper->has_stalled();'
          then:
            - logger.log: "Homing stall detected - setting home position"
            - lambda: |-
                g_stepper->report_position(0);
                g_stepper->enable_stall_detection(false);
                id(is_homing) = false;
            - lambda: |-
                g_stepper->set_current(${run_current}, ${hold_current});
                g_stepper->set_speed(${normal_speed});
            - logger.log: "Homing complete - restored normal settings"

  - interval: 500ms
    then:
      - lambda: |-
          if (!g_stepper) return;
          int pos = g_stepper->current_position;
          if (pos < 0) pos = 0;
          if (pos > id(blind_max_steps)) pos = id(blind_max_steps);
          float pct = (float)pos / id(blind_max_steps);
          // Only update if position changed by more than 1%
          if (abs(pct - id(last_cover_position)) > 0.01 || (pct == 0 && id(last_cover_position) != 0) || (pct == 1.0 && id(last_cover_position) != 1.0)) {
            id(last_cover_position) = pct;
            id(blind_cover).position = pct;
            id(blind_cover).publish_state();
          }

button:
  - platform: template
    name: "Home (Close Fully)"
    on_press:
      - logger.log: "Homing with StallGuard..."
      - lambda: 'id(is_homing) = true;'
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_current(${homing_current}, 0);
          g_stepper->set_speed(${homing_speed});
          g_stepper->enable_stall_detection(true);
          g_stepper->set_target(-${blind_max_steps} - 10000);
          ESP_LOGI("main", "Homing started - moving toward closed");

  - platform: template
    name: "Open Fully"
    on_press:
      - logger.log: "Opening blinds..."
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_target(id(blind_max_steps));

  - platform: template
    name: "Close Fully"
    on_press:
      - logger.log: "Closing blinds..."
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_target(0);

  - platform: template
    name: "Stop"
    on_press:
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->stop();
          id(is_homing) = false;
      - logger.log: "Motor stopped"

  - platform: template
    name: "Open 50%"
    on_press:
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_target(id(blind_max_steps) / 2);

  - platform: template
    name: "Step Open (+500)"
    on_press:
      - lambda: |-
          if (!g_stepper) return;
          int target = g_stepper->current_position + 500;
          if (target > id(blind_max_steps)) target = id(blind_max_steps);
          g_stepper->set_target(target);

  - platform: template
    name: "Step Close (-500)"
    on_press:
      - lambda: |-
          if (!g_stepper) return;
          int target = g_stepper->current_position - 500;
          if (target < 0) target = 0;
          g_stepper->set_target(target);

  - platform: template
    name: "Set Home (Position = 0)"
    on_press:
      - logger.log: "Manually setting current position as home (0)"
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->stop();
          g_stepper->report_position(0);
          g_stepper->enable_stall_detection(false);
          id(is_homing) = false;
      - lambda: |-
          g_stepper->set_current(${run_current}, ${hold_current});
          g_stepper->set_speed(${normal_speed});
      - logger.log: "Restored normal operation settings"

sensor:
  - platform: template
    name: "Blind Position"
    lambda: |-
      if (!g_stepper) return 0;
      return g_stepper->current_position;
    update_interval: 500ms
    unit_of_measurement: "steps"

  - platform: template
    name: "Blind Position %"
    lambda: |-
      if (!g_stepper) return 0;
      int pos = g_stepper->current_position;
      if (pos < 0) pos = 0;
      if (pos > id(blind_max_steps)) pos = id(blind_max_steps);
      return (float)pos / id(blind_max_steps) * 100.0;
    update_interval: 500ms
    unit_of_measurement: "%"

binary_sensor:
  - platform: template
    name: "Blind Motor Running"
    lambda: |-
      if (!g_stepper) return false;
      return g_stepper->is_running();

  - platform: template
    name: "Blind Stall Detected"
    lambda: |-
      if (!g_stepper) return false;
      return g_stepper->has_stalled();

cover:
  - platform: template
    name: "Blind"
    id: blind_cover
    device_class: blind
    has_position: true
    position_action:
      - lambda: |-
          if (!g_stepper) return;
          int target = (int)(pos * id(blind_max_steps));
          g_stepper->set_target(target);
    open_action:
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_target(id(blind_max_steps));
    close_action:
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_target(0);
    stop_action:
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->stop();
          id(is_homing) = false;
