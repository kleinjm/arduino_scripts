# Light Sensor Configuration
# Include this in blinds that have a photoresistor connected

sensor:
  - platform: adc
    pin: GPIO${light_sensor_pin}
    name: "Light Level"
    id: light_level
    update_interval: 5s
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: ""  # Override ESPHome's default of 'voltage' for ADC sensors
    attenuation: 12db  # Full 0-3.3V range
    filters:
      - multiply: 100  # Convert 0-1 to 0-100%
      - calibrate_linear:
          - 14 -> 0
          - 100 -> 100
      - clamp:
          min_value: 0
          max_value: 100
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
