esphome:
  name: esphome-web-5ad4c0
  friendly_name: Blind Right 1

esp32:
  board: esp32dev
  framework:
    type: arduino # Much faster to compile on a Raspberry Pi

# Enable logging
logger:

# Enable Home Assistant API and Web Interface
api:
web_server:
  port: 80

ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

stepper:
  - platform: a4988
    id: test_stepper
    step_pin: GPIO27
    dir_pin: GPIO14
    sleep_pin:
      number: GPIO13
      inverted: true
    max_speed: 200
    acceleration: 50
    deceleration: 50

number:
  - platform: template
    name: "Stepper Test Position"
    id: stepper_control
    min_value: -10000
    max_value: 10000
    step: 100
    optimistic: true
    on_value:
      then:
        - stepper.set_target:
            id: test_stepper
            target: !lambda "return x;"
