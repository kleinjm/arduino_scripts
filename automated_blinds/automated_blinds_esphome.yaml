# To run this script via the esphome cli
# esphome run automated_blinds_esphome.yaml
# esphome logs automated_blinds_esphome.yaml
#
# Then visit
# http://tmc_test_node.local/
#
# Note: You can upload this script overridding any previous one of any format,
# ie. a .ino file. You only need to reflash via https://web.esphome.io/ if there
# are driver issues or this is the first ever install on the chip.

esphome:
  name: blind-right-1
  friendly_name: Blind Right 1
  on_boot:
    priority: -100.0
    then:
      - delay: 5s
      - tmc2209.configure:
          id: blind_motor
          microsteps: 16
          interpolation: true
      - tmc2209.stallguard:
          id: blind_motor
          threshold: 120 # Slightly higher to prevent ghost stalls
      - tmc2209.currents:
          id: blind_motor
          irun: 20 # Increased to ~800mA for guaranteed movement
          ihold: 5
      # Ensure the stepper state is cleared and ready for commands
      - stepper.set_target:
          id: blind_motor
          target: 0

external_components:
  - source: github://slimcdk/esphome-custom-components@master
    components: [tmc2209_hub, tmc2209, stepper]

esp32:
  board: esp32dev
  framework:
    type: arduino

web_server:
  port: 80

logger:
  level: DEBUG

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: NONE
  output_power: 18.5dBm

uart:
  id: bus_tmc
  tx_pin: GPIO22
  rx_pin: GPIO23
  baud_rate: 115200

tmc2209_hub:
  uart_id: bus_tmc

stepper:
  - platform: tmc2209
    id: blind_motor
    address: 0
    step_pin: GPIO27
    dir_pin: GPIO14
    enn_pin:
      number: GPIO13
      inverted: false # Changed from true to test if your board is active-high or active-low
    diag_pin:
      number: GPIO25
      mode: INPUT_PULLDOWN
    max_speed: 400 steps/s
    acceleration: 100 steps/s^2
    on_stall:
      # Only stop if we are actually moving; prevents "ghost stalls" at boot
      lambda: |-
        if (id(blind_motor).current_position != id(blind_motor).target_position) {
          ESP_LOGW("tmc2209", "STALL DETECTED - Stopping Motor");
          id(blind_motor).stop();
        }

globals:
  - id: blind_max_pos
    type: int
    initial_value: "5000"
    restore_value: yes

cover:
  - platform: template
    name: "Window Blind"
    id: blind_cover
    device_class: blind
    has_position: true
    lambda: |-
      float pos = id(blind_motor).current_position;
      float max_pos = (float)id(blind_max_pos);
      if (max_pos <= 0) return 0.0;
      return 1.0 - (pos / max_pos);
    open_action:
      - stepper.set_target:
          id: blind_motor
          target: 0
    close_action:
      - stepper.set_target:
          id: blind_motor
          target: !lambda "return id(blind_max_pos);"
    stop_action:
      - stepper.stop: blind_motor
    position_action:
      - stepper.set_target:
          id: blind_motor
          target: !lambda "return (int)(id(blind_max_pos) * (1.0 - pos));"

script:
  - id: find_home
    then:
      - logger.log: "Homing Sequence Started..."
      - stepper.set_target:
          id: blind_motor
          target: -100000
      - wait_until:
          condition:
            lambda: 'return id(blind_motor).current_position == id(blind_motor).target_position;'
      - stepper.report_position:
          id: blind_motor
          position: 0
      - logger.log: "Homing Complete. Zero Point Set."

button:
  - platform: template
    name: "Recalibrate Home (StallGuard)"
    icon: "mdi:axis-arrow"
    on_press:
      - script.execute: find_home

  - platform: template
    name: "Set Current Position as Closed"
    icon: "mdi:content-save"
    on_press:
      - globals.set:
          id: blind_max_pos
          value: !lambda "return id(blind_motor).current_position;"
      - logger.log: "Max position updated and saved to flash."

  - platform: template
    name: "Manual Step Forward"
    on_press:
      - stepper.set_target:
          id: blind_motor
          target: !lambda "return id(blind_motor).current_position + 400;"
