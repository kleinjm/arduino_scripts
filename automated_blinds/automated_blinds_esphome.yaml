# Automated Blinds - ESPHome config with StallGuard
esphome:
  name: blind-right-1
  on_boot:
    priority: -100.0
    then:
      - logger.log: "Configuring TMC2209..."
      - tmc2209.currents:
          id: blind_motor
          run_current: 1000mA   # Good torque for blinds
          hold_current: 400mA
      - tmc2209.configure:
          id: blind_motor
          microsteps: 16
          enable_spreadcycle: false  # StealthChop for quiet operation
      - delay: 100ms
      - logger.log: "Motor configured - Ready (time-based homing)"

external_components:
  - source: github://slimcdk/esphome-custom-components@master
    components: [tmc2209_hub, tmc2209, stepper]

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

api:

ota:
  platform: esphome

web_server:
  port: 80

uart:
  id: bus_tmc
  tx_pin: GPIO22
  rx_pin: GPIO23
  baud_rate: 115200

tmc2209_hub:
  id: bus_tmc_hub
  uart_id: bus_tmc

stepper:
  - platform: tmc2209
    id: blind_motor
    address: 0
    step_pin: GPIO27
    dir_pin: GPIO14
    enn_pin: GPIO13
    # diag_pin removed - using our own GPIO polling instead
    max_speed: 800 steps/s  # Higher speed for better StallGuard readings
    acceleration: 400
    deceleration: 400

# Time-based homing - run motor until it hits mechanical stop
# No StallGuard needed - just run for fixed duration

globals:
  - id: blind_max_steps
    type: int
    initial_value: '20000'  # Adjust based on your blind's full travel
  - id: is_homing
    type: bool
    initial_value: 'false'

button:
  - platform: template
    name: "Home (Close Fully)"
    on_press:
      - logger.log: "Homing - slow & gentle toward closed..."
      - lambda: 'id(is_homing) = true;'
      # Lower current and speed for gentle homing (less wear on mechanism)
      - tmc2209.currents:
          id: blind_motor
          run_current: 400mA
          hold_current: 200mA
      - stepper.set_speed:
          id: blind_motor
          speed: 300 steps/s
      # Run motor backward (toward close) for more steps than full travel
      - stepper.set_target:
          id: blind_motor
          target: -25000  # Negative = toward closed, overshoot to ensure we hit stop
      # Wait for motor to finish (at 300 steps/s, 25000 steps = ~83 seconds)
      - delay: 90s
      - stepper.stop: blind_motor
      # Reset position AND target to 0 to prevent restart
      - stepper.report_position:
          id: blind_motor
          position: 0
      - stepper.set_target:
          id: blind_motor
          target: 0
      # Restore normal speed and current for operation
      - tmc2209.currents:
          id: blind_motor
          run_current: 1000mA
          hold_current: 400mA
      - stepper.set_speed:
          id: blind_motor
          speed: 800 steps/s
      - lambda: 'id(is_homing) = false;'
      - logger.log: "Homing complete - restored fast settings"

  - platform: template
    name: "Open Fully"
    on_press:
      - logger.log: "Opening blinds..."
      - stepper.set_target:
          id: blind_motor
          target: !lambda 'return id(blind_max_steps);'

  - platform: template
    name: "Close Fully"
    on_press:
      - logger.log: "Closing blinds..."
      - stepper.set_target:
          id: blind_motor
          target: 0

  - platform: template
    name: "Stop"
    on_press:
      - stepper.stop: blind_motor
      - lambda: 'id(is_homing) = false;'
      - logger.log: "Motor stopped"

  - platform: template
    name: "Open 25%"
    on_press:
      - stepper.set_target:
          id: blind_motor
          target: !lambda 'return id(blind_max_steps) / 4;'

  - platform: template
    name: "Open 50%"
    on_press:
      - stepper.set_target:
          id: blind_motor
          target: !lambda 'return id(blind_max_steps) / 2;'

  - platform: template
    name: "Open 75%"
    on_press:
      - stepper.set_target:
          id: blind_motor
          target: !lambda 'return id(blind_max_steps) * 3 / 4;'
