# Automated Blinds - ESPHome with Hardware Timer StallGuard
# Uses custom TMC2209 driver with ESP32 hardware timer for reliable stall detection

esphome:
  name: blind-right-1
  includes:
    - tmc2209_hw_stepper.h
  libraries:
    - "TMCStepper"
  on_boot:
    priority: 600.0
    then:
      - lambda: |-
          // Initialize stepper with pins: STEP, DIR, EN, DIAG, RX, TX
          static TMC2209HWStepper stepper_instance(27, 14, 13, 25, 23, 22);
          g_stepper = &stepper_instance;
          g_stepper->setup();
      - delay: 500ms
      - lambda: |-
          if (g_stepper) {
            g_stepper->set_speed(800);
            g_stepper->set_current(1000, 400);
            g_stepper->set_stall_threshold(1);  // Low threshold - stall when SG < 2
            ESP_LOGI("main", "Stepper ready - StallGuard enabled");
          }

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 0  # Disable UART logging - Serial2 used for TMC

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

api:

ota:
  platform: esphome

web_server:
  port: 80

globals:
  - id: blind_max_steps
    type: int
    initial_value: '20000'
  - id: is_homing
    type: bool
    initial_value: 'false'

# Process stall detection in main loop
interval:
  - interval: 50ms
    then:
      - lambda: |-
          if (g_stepper != nullptr) {
            g_stepper->loop();
          }
      # Check if homing stall occurred
      - if:
          condition:
            lambda: 'return id(is_homing) && g_stepper && g_stepper->has_stalled();'
          then:
            - logger.log: "Homing stall detected - setting home position"
            - lambda: |-
                g_stepper->report_position(0);
                g_stepper->enable_stall_detection(false);  // Disable until next homing
                id(is_homing) = false;
            # Restore normal current after homing
            - lambda: |-
                g_stepper->set_current(1000, 400);
                g_stepper->set_speed(800);
            - logger.log: "Homing complete - restored normal settings"

button:
  - platform: template
    name: "Home (Close Fully)"
    on_press:
      - logger.log: "Homing with StallGuard..."
      - lambda: 'id(is_homing) = true;'
      # Lower current and speed for gentle homing
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_current(400, 200);
          g_stepper->set_speed(300);
          g_stepper->enable_stall_detection(true);
          // Move toward closed - more than full travel to ensure we hit stop
          g_stepper->set_target(-30000);
          ESP_LOGI("main", "Homing started - moving toward closed");

  - platform: template
    name: "Open Fully"
    on_press:
      - logger.log: "Opening blinds..."
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_target(id(blind_max_steps));

  - platform: template
    name: "Close Fully"
    on_press:
      - logger.log: "Closing blinds..."
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_target(0);

  - platform: template
    name: "Stop"
    on_press:
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->stop();
          id(is_homing) = false;
      - logger.log: "Motor stopped"

  - platform: template
    name: "Open 25%"
    on_press:
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_target(id(blind_max_steps) / 4);

  - platform: template
    name: "Open 50%"
    on_press:
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_target(id(blind_max_steps) / 2);

  - platform: template
    name: "Open 75%"
    on_press:
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_target(id(blind_max_steps) * 3 / 4);

sensor:
  - platform: template
    name: "Blind Position"
    lambda: |-
      if (!g_stepper) return 0;
      return g_stepper->current_position;
    update_interval: 500ms
    unit_of_measurement: "steps"

  - platform: template
    name: "Blind Position %"
    lambda: |-
      if (!g_stepper) return 0;
      int pos = g_stepper->current_position;
      if (pos < 0) pos = 0;
      if (pos > id(blind_max_steps)) pos = id(blind_max_steps);
      return (float)pos / id(blind_max_steps) * 100.0;
    update_interval: 500ms
    unit_of_measurement: "%"

binary_sensor:
  - platform: template
    name: "Blind Motor Running"
    lambda: |-
      if (!g_stepper) return false;
      return g_stepper->is_running();

  - platform: template
    name: "Blind Stall Detected"
    lambda: |-
      if (!g_stepper) return false;
      return g_stepper->has_stalled();
