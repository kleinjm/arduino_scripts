# Automated Blinds - ESPHome with Hardware Timer StallGuard
# Uses custom TMC2209 driver with ESP32 hardware timer for reliable stall detection

#==============================================================================
# CONFIGURATION - Adjust these values for your setup
#==============================================================================
substitutions:
  device_name: blind-right-2

  # Movement Range
  blind_max_steps: "14000"        # Total steps for full blind travel (1000-100000)

  # Normal Operation
  run_current: "2000"             # Motor current in mA during movement (100-2000)
  hold_current: "0"             # Motor current in mA when stationary (0-1000)
  normal_speed: "2000"             # Motor speed in steps/s (100-2000)

  # Homing Operation
  homing_current: "2000"          # Current in mA for homing (100-2000)
  homing_speed: "300"             # Slower speed for reliable stall detection (50-500)
  homing_stall_threshold: "1"     # SGTHRS value (0-255), stall when SG_RESULT < 2×SGTHRS

  # Pin Configuration
  pin_step: "27"
  pin_dir: "14"
  pin_enable: "13"
  pin_diag: "25"
  pin_uart_rx: "23"
  pin_uart_tx: "22"

#==============================================================================
# END CONFIGURATION - Do not modify below unless you know what you're doing
#==============================================================================

esphome:
  name: ${device_name}
  includes:
    - tmc2209_hw_stepper.h
  libraries:
    - "TMCStepper"
  on_boot:
    priority: 600.0
    then:
      - lambda: |-
          // Initialize stepper with pins: STEP, DIR, EN, DIAG, RX, TX
          static TMC2209HWStepper stepper_instance(${pin_step}, ${pin_dir}, ${pin_enable}, ${pin_diag}, ${pin_uart_rx}, ${pin_uart_tx});
          g_stepper = &stepper_instance;
          g_stepper->setup();
      - delay: 500ms
      - lambda: |-
          if (g_stepper) {
            g_stepper->set_speed(${normal_speed});
            g_stepper->set_current(${run_current}, ${hold_current});
            g_stepper->set_stall_threshold(${homing_stall_threshold});
            ESP_LOGI("main", "Stepper ready - StallGuard enabled");
          }

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 0  # Disable UART logging - Serial2 used for TMC

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

api:

ota:
  platform: esphome

web_server:
  port: 80

globals:
  - id: blind_max_steps
    type: int
    initial_value: '${blind_max_steps}'
  - id: is_homing
    type: bool
    initial_value: 'false'

# Process stall detection in main loop
interval:
  - interval: 50ms
    then:
      - lambda: |-
          if (g_stepper != nullptr) {
            g_stepper->loop();
          }
      # Check if homing stall occurred
      - if:
          condition:
            lambda: 'return id(is_homing) && g_stepper && g_stepper->has_stalled();'
          then:
            - logger.log: "Homing stall detected - setting home position"
            - lambda: |-
                g_stepper->report_position(0);
                g_stepper->enable_stall_detection(false);  // Disable until next homing
                id(is_homing) = false;
            # Restore normal current after homing
            - lambda: |-
                g_stepper->set_current(${run_current}, ${hold_current});
                g_stepper->set_speed(${normal_speed});
            - logger.log: "Homing complete - restored normal settings"

button:
  - platform: template
    name: "Home (Close Fully)"
    on_press:
      - logger.log: "Homing with StallGuard..."
      - lambda: 'id(is_homing) = true;'
      # Set current and speed for homing
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_current(${homing_current}, 0);
          g_stepper->set_speed(${homing_speed});
          g_stepper->enable_stall_detection(true);
          // Move toward closed (negative direction) - more than full travel to ensure we hit stop
          g_stepper->set_target(-${blind_max_steps} - 10000);
          ESP_LOGI("main", "Homing started - moving toward closed");

  - platform: template
    name: "Open Fully"
    on_press:
      - logger.log: "Opening blinds..."
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_target(id(blind_max_steps));

  - platform: template
    name: "Close Fully"
    on_press:
      - logger.log: "Closing blinds..."
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_target(0);

  - platform: template
    name: "Stop"
    on_press:
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->stop();
          id(is_homing) = false;
      - logger.log: "Motor stopped"

  - platform: template
    name: "Open 50%"
    on_press:
      - lambda: |-
          if (!g_stepper) return;
          g_stepper->set_target(id(blind_max_steps) / 2);

  - platform: template
    name: "Step Open (+500)"
    on_press:
      - lambda: |-
          if (!g_stepper) return;
          int target = g_stepper->current_position + 500;
          if (target > id(blind_max_steps)) target = id(blind_max_steps);
          g_stepper->set_target(target);

  - platform: template
    name: "Step Close (-500)"
    on_press:
      - lambda: |-
          if (!g_stepper) return;
          int target = g_stepper->current_position - 500;
          if (target < 0) target = 0;
          g_stepper->set_target(target);

sensor:
  - platform: template
    name: "Blind Position"
    lambda: |-
      if (!g_stepper) return 0;
      return g_stepper->current_position;
    update_interval: 500ms
    unit_of_measurement: "steps"

  - platform: template
    name: "Blind Position %"
    lambda: |-
      if (!g_stepper) return 0;
      int pos = g_stepper->current_position;
      if (pos < 0) pos = 0;
      if (pos > id(blind_max_steps)) pos = id(blind_max_steps);
      // 0 = closed (0%), max_steps = open (100%)
      return (float)pos / id(blind_max_steps) * 100.0;
    update_interval: 500ms
    unit_of_measurement: "%"

binary_sensor:
  - platform: template
    name: "Blind Motor Running"
    lambda: |-
      if (!g_stepper) return false;
      return g_stepper->is_running();

  - platform: template
    name: "Blind Stall Detected"
    lambda: |-
      if (!g_stepper) return false;
      return g_stepper->has_stalled();
