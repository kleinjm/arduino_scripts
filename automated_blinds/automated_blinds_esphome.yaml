esphome:
  name: blind-right-1
  friendly_name: Blind Right 1
  on_boot:
    priority: -100
    then:
      - tmc2209.configure:
          id: blind_motor
          microsteps: 16
          interpolation: true
      - tmc2209.stallguard:
          id: blind_motor
          threshold: 100 # Adjust this if it stalls too early
      - tmc2209.currents:
          id: blind_motor
          standstill_mode: normal
          irun: 16 # Approx 600mA - matching your successful Arduino test
          ihold: 4
          tpowerdown: 20
          iholddelay: 10

external_components:
  - source: github://slimcdk/esphome-custom-components@master
    components: [tmc2209_hub, tmc2209, stepper]

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# UART bus - Using verified pins 22/23 and 115200 baud
uart:
  id: bus_tmc
  tx_pin: GPIO22
  rx_pin: GPIO23
  baud_rate: 115200

tmc2209_hub:
  uart_id: bus_tmc

stepper:
  - platform: tmc2209
    id: blind_motor
    address: 0
    step_pin: GPIO27
    dir_pin: GPIO14
    enn_pin:
      number: GPIO13
      inverted: true
    diag_pin:
      number: GPIO25
      mode: INPUT_PULLDOWN
    max_speed: 400 steps/s
    acceleration: 100 steps/s^2
    deceleration: 100 steps/s^2
    on_stall:
      - logger.log: "Motor stalled!"
      - stepper.stop: blind_motor

globals:
  - id: blind_max_position
    type: int
    initial_value: "5000"
    restore_value: yes

cover:
  - platform: template
    name: "Window Blind"
    id: blind_cover
    device_class: blind
    has_position: true
    lambda: |-
      int pos = id(blind_motor).current_position;
      int max_pos = id(blind_max_position);
      if (max_pos == 0) return 0.0;
      float pct = 1.0 - ((float)pos / (float)max_pos);
      if (pct < 0) pct = 0;
      if (pct > 1) pct = 1;
      return pct;
    open_action:
      - stepper.set_target:
          id: blind_motor
          target: 0
    close_action:
      - stepper.set_target:
          id: blind_motor
          target: !lambda "return id(blind_max_position);"
    stop_action:
      - stepper.stop: blind_motor
    position_action:
      - stepper.set_target:
          id: blind_motor
          target: !lambda "return (int)(id(blind_max_position) * (1.0 - pos));"

script:
  - id: find_home
    then:
      - logger.log: "Homing: Moving Up until stall..."
      - stepper.set_target:
          id: blind_motor
          target: -100000
      - wait_until:
          condition:
            lambda: 'return id(blind_motor).current_position == id(blind_motor).target_position;'
      - stepper.report_position:
          id: blind_motor
          position: 0
      - logger.log: "Home reached. Position Reset to 0."

button:
  - platform: template
    name: "Calibrate Home Position"
    icon: "mdi:target-variant"
    on_press:
      - script.execute: find_home

  - platform: template
    name: "Stop Motor"
    on_press:
      - stepper.stop: blind_motor
