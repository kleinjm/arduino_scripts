# To run this script via the esphome cli
# esphome run uart_esphome_connection_test.yaml
# esphome logs uart_esphome_connection_test.yaml
#
# Then visit
# http://tmc_test_node.local/
#
# Note: You can upload this script overridding any previous one of any format,
# ie. a .ino file. You only need to reflash via https://web.esphome.io/ if there
# are driver issues or this is the first ever install on the chip.

esphome:
  name: tmc_test_node
  friendly_name: TMC UART Test

esp32:
  board: esp32dev
  framework:
    type: arduino

# Essential for the web interface
web_server:
  port: 80

external_components:
  - source: github://slimcdk/esphome-custom-components@master
    components: [tmc2209_hub, tmc2209, stepper]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Helpful for avoiding the connection errors you saw earlier
  fast_connect: true

# Enable the native API for Home Assistant
api:
ota:
  - platform: esphome

logger:
  level: DEBUG

# The UART bridge configuration
uart:
  id: bus_tmc
  tx_pin: GPIO22
  rx_pin: GPIO23
  baud_rate: 115200

tmc2209_hub:
  uart_id: bus_tmc

stepper:
  - platform: tmc2209
    id: test_motor
    address: 0
    step_pin: GPIO27
    dir_pin: GPIO14
    enn_pin: GPIO13 # Enable pin
    max_speed: 400 steps/s
    acceleration: 100 steps/s^2

# This creates a "Test Connection" button on the web page
button:
  - platform: template
    name: "Check UART Connection"
    on_press:
      - logger.log: "Manual UART Check Requested..."
      # This forces a register read to the log
      - tmc2209.configure:
          id: test_motor
          microsteps: 16
      - logger.log: "If no error appeared above, UART is healthy."

  - platform: template
    name: "Spin Motor Test"
    on_press:
      - stepper.set_target:
          id: test_motor
          target: 1600 # One rotation
      - delay: 2s
      - stepper.set_target:
          id: test_motor
          target: 0
